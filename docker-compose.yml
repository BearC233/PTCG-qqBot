name: qqbot

services:
  # QQ 协议端：NapCat (QQ NT 无头 + WebUI + OneBot11)
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    environment:
      - NAPCAT_UID=0
      - NAPCAT_GID=0
      - TZ=Asia/Shanghai
    ports:
      - "6099:6099"   # WebUI / 扫码登录（建议登录完成后在安全组关闭此端口）
    # OneBot11 的 3000/3001 仅在容器内网暴露，bot 通过 qqnet 访问，无需映射到公网
    expose:
      - "3000"
      - "3001"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
    shm_size: 256m
    networks:
      - qqnet

  # 自研 AI 机器人
  bot:
    build: ./bot
    container_name: qqbot
    restart: unless-stopped
    depends_on:
      - napcat
    environment:
      - TZ=Asia/Shanghai
      - LLM_API_KEY=${LLM_API_KEY:-}
      - POSTGRES_DSN=${POSTGRES_DSN:-}
    volumes:
      - ./bot/config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    mem_limit: 384m
    networks:
      - qqnet

networks:
  qqnet:
    driver: bridge
